<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Creobotics — Learn Robotics, Anywhere</title>
<meta name="description" content="Creobotics: an offline-friendly, browser-based robotics learning app with modules, quizzes, and progress tracking." />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<div id="app">

  <!-- ============ AUTH: LOGIN VIEW ============ -->
  <section id="view-login" class="view">
    <div class="brand-bar">
      <div class="brand-mark"><img src="images/app_logo.png" alt="Creobotics logo" /></div>
      <div class="brand-name">Creobotics</div>
    </div>
    <div class="auth-wrap">
      <div class="auth-card">
        <div class="auth-icon"><img src="images/app_logo.png" alt="Creobotics logo" /></div>
        <h1 class="auth-title">Welcome back</h1>
        <p class="auth-subtitle">Log in to continue learning robotics</p>

        <div id="login-error" class="error-banner hidden"></div>
        <div id="login-success" class="success-banner hidden"></div>

        <form id="login-form">
          <div class="field">
            <label for="login-email">Email</label>
            <div class="input-wrap">
              <input id="login-email" type="email" autocomplete="email" placeholder="you@example.com" required />
            </div>
          </div>
          <div class="field">
            <label for="login-password">Password</label>
            <div class="input-wrap">
              <input id="login-password" type="password" autocomplete="current-password" placeholder="••••••••" required />
              <button type="button" class="toggle-visibility" data-target="login-password">Show</button>
            </div>
          </div>
          <button type="submit" class="btn btn-primary">Get Started</button>
        </form>

        <p class="auth-switch" style="margin-top:10px; margin-bottom:0;">
          <button type="button" id="forgot-password-link">Forgot password?</button>
        </p>

        <p class="auth-switch">Don't have an account?
          <button type="button" id="go-signup">Sign Up</button>
        </p>
      </div>
    </div>
  </section>

  <!-- ============ AUTH: SIGNUP VIEW ============ -->
  <section id="view-signup" class="view hidden">
    <div class="brand-bar">
      <div class="brand-mark"><img src="images/app_logo.png" alt="Creobotics logo" /></div>
      <div class="brand-name">Creobotics</div>
    </div>
    <div class="auth-wrap">
      <div class="auth-card">
        <div class="auth-icon"><img src="images/app_logo.png" alt="Creobotics logo" /></div>
        <h1 class="auth-title">Join Creobotics</h1>
        <p class="auth-subtitle">Create a free account to start learning</p>

        <div id="signup-error" class="error-banner hidden"></div>

        <form id="signup-form">
          <div class="field">
            <label for="signup-name">Full Name</label>
            <div class="input-wrap">
              <input id="signup-name" type="text" autocomplete="name" placeholder="Jane Dela Cruz" required />
            </div>
          </div>
          <div class="field">
            <label for="signup-email">Email</label>
            <div class="input-wrap">
              <input id="signup-email" type="email" autocomplete="email" placeholder="you@example.com" required />
            </div>
          </div>
          <div class="field">
            <label for="signup-school">School</label>
            <div class="input-wrap">
              <input id="signup-school" type="text" autocomplete="school" placeholder="Polytechnic University of the Philippines" required />
            </div>
          </div>
          <div class="field">
            <label for="signup-password">Password</label>
            <div class="input-wrap">
              <input id="signup-password" type="password" autocomplete="new-password" placeholder="At least 6 characters" required />
              <button type="button" class="toggle-visibility" data-target="signup-password">Show</button>
            </div>
          </div>
          <div class="field">
            <label for="signup-confirm">Confirm Password</label>
            <div class="input-wrap">
              <input id="signup-confirm" type="password" autocomplete="new-password" placeholder="Repeat password" required />
              <button type="button" class="toggle-visibility" data-target="signup-confirm">Show</button>
            </div>
          </div>
          <button type="submit" class="btn btn-primary">Create Account</button>
        </form>

        <p class="auth-switch">Already have an account?
          <button type="button" id="go-login">Log In</button>
        </p>
      </div>
    </div>
  </section>

  <!-- ============ PROFILE SETUP: AVATAR + NICKNAME (first thing after auth) ============ -->
  <section id="view-avatar-setup" class="view hidden">
    <div class="brand-bar">
      <div class="brand-mark"><img src="images/app_logo.png" alt="Creobotics logo" /></div>
      <div class="brand-name">Creobotics</div>
    </div>
    <div class="auth-wrap">
      <div class="auth-card" style="max-width:560px;">
        <h1 class="auth-title" id="avatar-setup-heading">Set up your profile</h1>
        <p class="auth-subtitle" id="avatar-setup-subtitle">Pick an avatar and a nickname to get started</p>

        <div id="avatar-setup-error" class="error-banner hidden"></div>

        <div class="avatar-grid" id="avatar-grid"></div>

        <div class="field" style="margin-top:20px;">
          <label for="setup-nickname">Nickname</label>
          <div class="input-wrap">
            <input id="setup-nickname" type="text" placeholder="What should we call you?" maxlength="20" />
          </div>
        </div>

        <button type="button" id="avatar-setup-continue" class="btn btn-primary" style="width:100%; margin-top:10px;">Continue</button>

        <p class="auth-switch hidden" id="avatar-setup-cancel-wrap">
          <button type="button" id="avatar-setup-cancel">Cancel</button>
        </p>
      </div>
    </div>
  </section>

  <!-- ============ MAIN APP SHELL (post-login) ============ -->
  <section id="view-app" class="view hidden">
    <div class="app-shell">

      <!-- Sidebar (desktop) -->
      <aside class="sidebar">
        <div class="brand-bar" style="padding:0;">
          <div class="brand-mark"><img src="images/app_logo.png" alt="Creobotics logo" /></div>
          <div class="brand-name">Creobotics</div>
        </div>
        <ul class="nav-list">
          <li><button class="nav-item" data-page="home">Dashboard</button></li>
          <li><button class="nav-item" data-page="modules">eBook Modules</button></li>
          <li><button class="nav-item" data-page="profile">Profile</button></li>
          <li><button class="nav-item" data-page="settings">Settings</button></li>
          <li><button class="nav-item" data-page="about">About</button></li>
        </ul>
        <div class="sidebar-footer">
          <button id="sidebar-logout" class="btn btn-outline btn-sm" style="width:100%; background:rgba(255,255,255,0.9);">Log Out</button>
        </div>
      </aside>

      <!-- Main content: pages are rendered here by JS -->
      <main class="main-content" id="main-content">
        <!-- JS injects page markup here -->
      </main>
    </div>

    <!-- Mobile bottom nav -->
    <nav class="bottom-nav">
      <div class="bottom-nav-inner">
        <button class="bottom-nav-item" data-page="home">Dashboard</button>
        <button class="bottom-nav-item" data-page="modules">Modules</button>
        <button class="bottom-nav-item" data-page="profile">Profile</button>
        <button class="bottom-nav-item" data-page="settings">Settings</button>
      </div>
    </nav>
  </section>

</div>

<!-- Toast notification -->
<div id="toast"></div>

<!-- Modal root (confirm dialogs injected here) -->
<div id="modal-root"></div>

<script src="js/data.js"></script>
<script src="js/app.js"></script>
</body>
</html>
